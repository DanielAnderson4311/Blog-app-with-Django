{% load static %}
<html>

<head>
    <title>Add post</title>
    <link rel="stylesheet" href="{% static 'base/styles.css' %}">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>
            <div class="close_icon" style="position: absolute; top: 0; left: 0; z-index: 999;">
            <a href="/posts/">
            <span class="material-symbols-outlined">arrow_back</span>
            </a>
        </div>
    <div class="bannerimg">
        <div class="banner">
            <div class="glass_container">
                <h1>
                    Add a post
                </h1>
                <form action="/create/" method="post">
                    {% csrf_token %}
                    <div class="fstyle">
                        {{ form }}
                        <input type="submit" value="Save">
                    </div>
                </form>
                {% if success %}
                <script>
                    alert("Saved")
                </script>
                {% endif %}
                {% if errors %}
                <script>
                    alert("{{ errors }}")
                </script>
                {% endif %}
            </div>
        </div>
    </div>
</body>

</html>
